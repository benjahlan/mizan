<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B6B53">
<title>Mizan — Wealth Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE; --page:#eceae4; --card:#ffffff; --sheet:#F7F6F2;
  --ink:#14201C; --ink-2:#4A544F; --muted:#8A948E; --muted-2:#A6AEA9;
  --line:rgba(20,32,28,.08); --line-2:rgba(20,32,28,.12); --line-soft:rgba(20,32,28,.05);
  --green:#0B6B53; --green-2:#0e8f6c; --green-d:#0a5a47; --green-dd:#08493a;
  --green-soft:#EEF4F1; --green-pill:#E7F1ED; --green-ink:#0B6B53;
  --pos:#1F8A5B; --pos-soft:#E4F2EA; --neg:#C0492F; --neg-soft:#FBEBE7;
  --gold:#B8892B; --gold-2:#9a6f1c; --gold-soft:#F6EFDF; --gold-ink:#7d6320;
  --chip:#ECEAE3; --chip-2:#F1F0EA; --inp:#F9F8F4;
  --grand-a:#14201C; --grand-b:#243430;
  --toast-bg:#14201C; --toast-fg:#ffffff; --toast-accent:#83d5c6;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 4px 16px rgba(16,24,20,.05);
  --shadow-hero:0 14px 34px rgba(8,73,58,.32);
  --r:16px; --r-lg:20px; --r-xl:24px; --nav-h:66px;
  --ff:'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --num:'Manrope','Plus Jakarta Sans',sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#101512; --page:#080b09; --card:#171d1a; --sheet:#141a17;
  --ink:#eef2ef; --ink-2:#b9c2bc; --muted:#8b968f; --muted-2:#6f7a73;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.05);
  --green:#1fa87e; --green-2:#25c091; --green-d:#158063; --green-dd:#0d5c47;
  --green-soft:#122a21; --green-pill:#14342a; --green-ink:#37cfa0;
  --pos:#37c98c; --pos-soft:#123026; --neg:#e8705a; --neg-soft:#331a15;
  --gold:#d3a441; --gold-2:#b9862c; --gold-soft:#2a2314; --gold-ink:#e3bd6b;
  --chip:#232a26; --chip-2:#1e2521; --inp:#1e2521;
  --grand-a:#0b120f; --grand-b:#1b2621;
  --toast-bg:#eef2ef; --toast-fg:#14201C; --toast-accent:#0B6B53;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.32);
  --shadow-hero:0 14px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--ff);background:var(--page);color:var(--ink);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
[hidden]{display:none!important}
::-webkit-scrollbar{width:0;height:0}
h1,h2,h3,h4{margin:0}

#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;overflow:hidden}

/* header */
.head{flex:none;display:flex;align-items:center;gap:12px;padding:14px 18px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.head .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,var(--green),var(--green-2));
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(11,107,83,.3);flex:none}
.head .back{width:38px;height:38px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.head .htxt{flex:1;min-width:0}
.head .htitle{font-size:17px;font-weight:700;line-height:1.2}
.head .hsub{font-size:11.5px;color:var(--muted);font-weight:500}
.head .hbtn{border:1px solid var(--line-2);background:var(--card);height:36px;padding:0 12px;border-radius:11px;
  display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:600;font-size:13px}
.head .hbtn:active{transform:scale(.95)}

/* scroll area */
.scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px}
.pad{padding:16px 16px 30px;display:flex;flex-direction:column;gap:14px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;border-radius:var(--r-xl);padding:22px;color:#fff;overflow:hidden;box-shadow:var(--shadow-hero);
  background:linear-gradient(155deg,var(--green) 0%,var(--green-d) 55%,var(--green-dd) 100%)}
.hero.gold{background:linear-gradient(155deg,var(--gold),var(--gold-2));box-shadow:0 12px 30px rgba(154,111,28,.3)}
.hero .spark{position:absolute;inset:0;opacity:.5;pointer-events:none}
.hero .lbl{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.82;font-weight:600;display:flex;align-items:center;gap:7px}
.hero .big{font-size:44px;font-weight:800;line-height:1.04;margin-top:6px}
.hero .code{font-size:14px;opacity:.85;font-weight:600;margin-top:2px}
.hero .chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .chipf{background:rgba(255,255,255,.14);border-radius:11px;padding:7px 11px;backdrop-filter:blur(4px)}
.hero .chipf .c{font-size:10.5px;opacity:.78;font-weight:600}
.hero .chipf .v{font-size:15px;font-weight:700}
.hero .foot{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}
.gpill{display:flex;align-items:center;gap:5px;border-radius:9px;padding:5px 9px;font-weight:700;font-size:13px}

/* quick actions */
.qacts{display:flex;gap:10px}
.qbtn{flex:1;border-radius:var(--r);padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:12.5px}
.qbtn.pri{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(11,107,83,.28)}
.qbtn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line-2)}
.qbtn:active{transform:scale(.97)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card.p{padding:16px}
.card.pl{padding:6px 4px}
.cardh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px}
.cardh .t{font-size:13px;font-weight:700}
.link{color:var(--green-ink);font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 2px}

/* balance row */
.brow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow)}
.brow:active{transform:scale(.995)}
.bic{width:42px;height:42px;border-radius:13px;background:var(--green-soft);color:var(--green-ink);display:flex;align-items:center;justify-content:center;flex:none}
.bmid{flex:1;min-width:0}
.bnm{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px;margin-top:1px}
.bsub .curc{font-weight:700;color:var(--green-ink)}
.bamt{text-align:end}
.bamt .a{font-size:16px;font-weight:800}
.bamt .cv{font-size:11.5px;color:var(--muted);font-weight:600}
.chev{color:var(--muted-2);flex:none}

.hidrow{background:var(--chip-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:13px;opacity:.9}
.hidrow .bic{background:var(--chip);color:var(--muted)}
.smallbtn{border:1px solid var(--green);background:var(--card);color:var(--green-ink);border-radius:10px;padding:7px 12px;font-weight:700;font-size:12px}

/* grand total dark card */
.grand{background:linear-gradient(150deg,var(--grand-a),var(--grand-b));border-radius:var(--r-lg);padding:18px;color:#fff}
.grand .l{font-size:12px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grand .row{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.grand .v{font-size:19px;font-weight:800}
.grand .c{font-size:11px;opacity:.6;font-weight:600}

/* stat row */
.statset{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.statset .k{font-size:11px;color:var(--muted);font-weight:600}
.statset .v{font-size:15px;font-weight:800;margin-top:1px}

/* charts */
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 14px 12px;box-shadow:var(--shadow)}
.chartwrap{position:relative}
svg.chart{display:block;width:100%;height:auto;direction:ltr;overflow:visible}
.legend{display:flex;gap:14px;padding:0 2px 8px;font-size:11px;font-weight:600}
.legend .k{display:flex;align-items:center;gap:5px}
.legend .sw{width:9px;height:9px;border-radius:3px;display:inline-block}

/* log rows */
.logrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.tagpill{display:flex;align-items:center;gap:5px;border-radius:8px;padding:4px 9px;font-weight:700;font-size:12.5px}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:6px}

/* zakat */
.zexplain{background:var(--gold-soft);border:1px solid rgba(184,137,43,.25);border-radius:14px;padding:13px 15px;font-size:12.5px;color:var(--gold-ink);line-height:1.5;font-weight:500}
.zrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}

/* toggle */
.tgl{width:48px;height:28px;border-radius:15px;background:var(--line-2);position:relative;flex:none;transition:background .18s}
.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgl.on{background:var(--green)}
.tgl.on.gold{background:var(--gold)}
.tgl.on::after{transform:translateX(20px)}
[dir="rtl"] .tgl.on::after{transform:translateX(-20px)}

/* progress */
.prog{height:9px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:12px}
.prog>i{display:block;height:100%;border-radius:6px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* goals */
.goalcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}

/* settings */
.setgrp{display:flex;flex-direction:column;gap:8px}
.setcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:none}
.setrow .ic{width:36px;height:36px;border-radius:11px;background:var(--chip-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:none}
.setrow .t{font-size:14px;font-weight:700}
.setrow .d{font-size:11.5px;color:var(--muted);font-weight:500}
.finp{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;background:var(--inp);color:var(--ink)}
.fsel{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;background:var(--inp);color:var(--ink);appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238A948E' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-inline-end:26px}
[dir="rtl"] .fsel{background-position:left 8px center}
.derived{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--green-soft)}
.derived .t{flex:1;font-size:13px;font-weight:700;color:var(--green-ink)}
.derived .v{font-size:15px;font-weight:800;color:var(--green-ink)}

/* more menu */
.morerow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.morerow .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}

/* filter chips */
.fchip{border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);border-radius:20px;padding:7px 13px;font-weight:700;font-size:12px}
.fchip.on{background:var(--green-pill);color:var(--green-ink);border-color:var(--green)}

/* history rows */
.hrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.hrow .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}

/* nav */
.nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;color:var(--muted)}
.nav .pill{width:46px;height:26px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.nav button.on{color:var(--green-ink)}
.nav button.on .pill{background:var(--green-pill)}
.nav .lb{font-size:10.5px;font-weight:600}
.nav button.on .lb{font-weight:800}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(10,20,16,.42);z-index:60;display:flex;align-items:flex-end;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--sheet);border-radius:26px 26px 0 0;padding:14px 20px calc(26px + env(safe-area-inset-bottom));
  animation:up .26s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow-y:auto}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:800}
.sheet .sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.flabel{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.tin{width:100%;border:1px solid var(--line-2);border-radius:13px;padding:12px;font-size:15px;font-weight:600;background:var(--card);color:var(--ink)}
.tin:focus,.finp:focus,.fsel:focus,.bigin:focus{outline:none;border-color:var(--green)}
.bigwrap{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:6px 14px;margin-top:6px}
.bigin{flex:1;border:none;outline:none;background:none;font-size:28px;font-weight:800;padding:10px 0;color:var(--ink)}
.typebtn{flex:1;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);border-radius:13px;padding:11px;font-weight:700;font-size:12.5px}
.typebtn.on{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.typebtn.on.alt{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.sbtns{display:flex;gap:10px;margin-top:18px}
.sbtn{border-radius:14px;padding:13px;font-weight:700;font-size:14px;text-align:center}
.sbtn.pri{background:var(--green);color:#fff;flex:2}
.sbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line-2);flex:1}
.sbtn.danger{background:var(--neg-soft);color:var(--neg);border:1px solid rgba(192,73,47,.3)}
.trprev{font-size:12px;color:var(--green-ink);font-weight:700;background:var(--green-soft);border-radius:11px;padding:10px 12px;margin-top:10px}

/* denominations */
.dgrp{margin-top:4px}
.dghead{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:10px 2px 4px;border-top:1px solid var(--line-soft)}
.dgrow{display:flex;align-items:center;gap:10px;padding:6px 2px}
.dgrow .dn{width:70px;font-weight:800;font-size:14px}
.dgrow .x{color:var(--muted)}
.dgrow input{width:66px;text-align:center;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:8px 4px;font-weight:800}
.dgrow input:focus{outline:none;border-color:var(--green)}
.dgrow .eq{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:600}

/* empty */
.empty{text-align:center;padding:18px 14px;color:var(--muted);font-size:12.5px;font-weight:600}

/* toast */
#toast{position:absolute;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(var(--nav-h) + 14px);z-index:70;
  background:var(--toast-bg);color:var(--toast-fg);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:340px;opacity:0;transition:.24s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast .tmsg{font-size:13px;font-weight:600}
#toast .taction{color:var(--toast-accent);font-weight:800;font-size:13px}

/* lock */
#lock{position:absolute;inset:0;z-index:90;background:linear-gradient(160deg,var(--green),var(--green-dd));
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:18px}
#lock .fp{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.4)}
#lock .fp:active{transform:scale(.95)}
#lock h2{font-size:22px} #lock p{opacity:.85;font-size:14px;margin-top:-8px}

/* ===== compact + fit-to-screen (v2) : persistent nav + smaller adaptive cards ===== */
html,body{height:100%}
body{overflow:hidden;font-size:14px}
#app{height:100%;min-height:0}
.pad{padding:12px 12px 26px;gap:11px}
.hero{padding:17px}
.hero .lbl{font-size:11px}
.hero .big{font-size:clamp(27px,8.4vw,40px);margin-top:4px}
.hero .code{font-size:13px}
.hero .chips{margin-top:11px;gap:7px}
.hero .chipf{padding:6px 9px}
.hero .chipf .v{font-size:13.5px}
.hero .foot{margin-top:12px;padding-top:11px}
.qbtn{padding:11px 6px;font-size:12px}
.card.p{padding:13px}
.cardh{padding:9px 12px 6px}
.cardh .t{font-size:12.5px}
.grand{padding:15px}
.grand .row{margin-top:9px}
.grand .v{font-size:clamp(15px,4.6vw,19px)}
.brow{padding:11px 12px;gap:11px}
.bic{width:37px;height:37px;border-radius:12px}
.bnm{font-size:14px}
.bamt .a{font-size:15px}
.statset{gap:12px;margin-top:11px;padding-top:10px}
.statset .v{font-size:14px}
.chartcard{padding:13px 12px 10px}
.logrow{padding:12px}
.goalcard{padding:13px}
.morerow{padding:12px 13px}
.morerow .ic{width:38px;height:38px;border-radius:12px}
.zrow,.hrow{padding:11px 12px}
.setrow{padding:11px 14px}
.setrow .ic{width:34px;height:34px}
.sect{font-size:11.5px}
.sheet{max-height:88dvh}
</style>
</head>
<body>
<div id="app">
  <div id="lock" hidden>
    <div class="fp" id="fpBtn"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3.5a8 8 0 0 0-8 8M12 7.5a4 4 0 0 0-4 4v4M12 11.5v5M15.8 12a4 4 0 0 0-1.8-3.3M19.8 12a8 8 0 0 0-4-6.9"/></svg></div>
    <h2 id="lockT">Mizan is locked</h2>
    <p id="lockP">Tap to unlock</p>
  </div>
  <header class="head" id="head"></header>
  <div class="scr" id="scr"></div>

  return{get(k){try{return ok?localStorage.getItem(k):(mem[k]??null);}catch(e){return mem[k]??null;}},
         set(k,v){try{ok?localStorage.setItem(k,v):(mem[k]=v);}catch(e){mem[k]=v;}}};})();

const CODES=["USD","SAR","YER-N","YER-S"];
const CURI={USD:{sym:"$",en:"US Dollar",ar:"دولار",dec:2},SAR:{sym:"﷼",en:"Saudi Riyal",ar:"ريال سعودي",dec:2},
  "YER-N":{sym:"﷼",en:"Yemeni Riyal (North)",ar:"ريال يمني (شمال)",dec:0},"YER-S":{sym:"﷼",en:"Yemeni Riyal (South)",ar:"ريال يمني (جنوب)",dec:0}};

    rates:{usdYern:530,sarYern:140,usdYers:1650},

      {id:"south",name:"Cash Express (South)",nameAr:"كاش إكسبريس (الجنوب)",icon:"bank",holdings:[{cur:"YER-S",amount:0}],eligible:true,changed:Date.now()},

let S;
function load(){const raw=Store.get("mizan2.state");if(raw){try{S=deepMerge(defaults(),JSON.parse(raw));migrateLocs();return;}catch(e){}}S=defaults();}
function migrateLocs(){
  S.locations.forEach(l=>{if(!l.denoms&&!l.holdings)l.holdings=[{cur:l.cur||"SAR",amount:+l.amount||0}];if(l.holdings&&!l.holdings.length)l.holdings=[{cur:"SAR",amount:0}];});
  const lk=S.locations.find(l=>l.denoms);
  if(lk){const keep=[],moved={};
    lk.denoms.forEach(d=>{if(d.cur==="SAR")keep.push(d);else if(d.cur==="YER-N"||d.cur==="USD")moved[d.cur]=(moved[d.cur]||0)+(+d.n||0)*d.denom;});
    lk.denoms=keep.length?keep:[{cur:"SAR",denom:500,n:0},{cur:"SAR",denom:100,n:0},{cur:"SAR",denom:50,n:0}];
    if(!lk.holdings)lk.holdings=[];
    ["YER-N","USD"].forEach(c=>{if(!lk.holdings.find(h=>h.cur===c))lk.holdings.push({cur:c,amount:0});});
    Object.keys(moved).forEach(c=>{const h=lk.holdings.find(x=>x.cur===c);if(h)h.amount=(+h.amount||0)+moved[c];});
  }
}
function deepMerge(base,ov){if(Array.isArray(base))return Array.isArray(ov)?ov:base;
  if(base&&typeof base==="object"){const o={...base};for(const k in base)if(ov&&k in ov)o[k]=deepMerge(base[k],ov[k]);
    for(const k in(ov||{}))if(!(k in o))o[k]=ov[k];return o;}return ov===undefined?base:ov;}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>Store.set("mizan2.state",JSON.stringify(S)),120);}

/* ------- currency engine (YER-N pivot; user-entered rates) ------- */
function rSar(){return S.rates.sarYern>0?S.rates.sarYern:140;}
function rUsd(){return S.rates.usdYern>0?S.rates.usdYern:530;}
function toYern(cur){const r=S.rates,uy=rUsd(),sy=rSar(),us=r.usdYers>0?r.usdYers:1650;if(cur==="USD")return uy;if(cur==="SAR")return sy;if(cur==="YER-S")return uy/us;return 1;}
function convert(amt,from,to){return (+amt||0)*toYern(from)/toYern(to);}
function holdingsOf(l){return l.holdings||(l.denoms?[]:[{cur:l.cur||"SAR",amount:+l.amount||0}]);}
function locYern(l){let y=0;if(l.denoms)y+=l.denoms.reduce((a,d)=>a+(+d.n||0)*d.denom*toYern(d.cur),0);if(l.holdings)y+=l.holdings.reduce((a,h)=>a+(+h.amount||0)*toYern(h.cur),0);if(!l.denoms&&!l.holdings)y+=(+l.amount||0)*toYern(l.cur);return y;}
function locPrimaryCur(l){if(l.denoms)return l.cur||"SAR";const h=holdingsOf(l);return h.length?h[0].cur:"SAR";}
function isMulti(l){return !l.denoms&&l.holdings&&l.holdings.length>1;}
function locSar(l){return locYern(l)/rSar();}
function lockerAmount(l){return locYern(l)/toYern(l.cur||"SAR");}
function addToHolding(l,cur,delta){if(!l.holdings)l.holdings=holdingsOf(l);const h=l.holdings.find(x=>x.cur===cur);if(h)h.amount=(+h.amount||0)+delta;else l.holdings.push({cur,amount:delta});l.changed=Date.now();}
function visibleLocs(){return S.locations.filter(l=>!l.hidden);}
function grandYern(){return visibleLocs().reduce((a,l)=>a+locYern(l),0);}
function eligibleYern(){return S.locations.filter(l=>l.eligible&&!l.hidden).reduce((a,l)=>a+locYern(l),0);}
function usdToSar(){return rUsd()/rSar();}
function totalsAll(){const y=grandYern();return{yern:y,sar:y/rSar(),usd:y/rUsd(),yers:y/toYern("YER-S")};}
function totalIn(code){return grandYern()/toYern(code);}
function codeValue(code){return grandYern()/toYern(code);}

/* ------- format ------- */
function numLoc(){return S.settings.arabicDigits?"en-US-u-nu-arab":"en-US";}
function dLoc(){const ext=[];if(S.settings.hijri)ext.push("ca-islamic");if(S.settings.arabicDigits)ext.push("nu-arab");const base=S.settings.lang==="ar"?"ar-SA":"en-GB";return ext.length?base+"-u-"+ext.join("-"):base;}
function fmt(n,dec){if(!isFinite(n))n=0;const d=dec==null?0:dec;return(+n).toLocaleString(numLoc(),{minimumFractionDigits:d,maximumFractionDigits:d});}
function money(n,code){let d=CURI[code]?.dec??0;if(Math.abs(n)>=1000)d=0;return fmt(n,d);}
function moneyC(n,code){return money(n,code)+" "+code;}
function parseNum(s){if(s==null)return 0;const v=parseFloat((""+s).replace(/[^0-9.\-]/g,""));return isNaN(v)?0:v;}
function fmtInput(v){const n=Number(v);if(!isFinite(n)||n===0)return"";return n.toLocaleString("en-US",{maximumFractionDigits:2});}
function signed(n){return(n>=0?"+":"−")+money(Math.abs(n),"SAR");}
function uid(p){return(p||"id")+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
const DAY=86400000;
function dDays(a,b){return Math.max(0,Math.round((b-a)/DAY));}
function fmtDate(ts){return new Date(ts).toLocaleDateString(dLoc(),{day:"numeric",month:"short",year:"numeric"});}
function fmtDateShort(ts){const d=dDays(ts,Date.now());const ar=S.settings.lang==="ar";
  if(d===0)return ar?"اليوم":"Today";if(d===1)return ar?"أمس":"Yesterday";if(d<7)return ar?(d+" أيام"):(d+"d ago");return fmtDate(ts);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function dateTime(ts){return new Date(ts).toLocaleString(dLoc(),{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}

/* ------- history ------- */
function pushHist(kind,name,old,val,cur,field){S.history.unshift({id:uid('h'),ts:Date.now(),kind,name,old,val,cur,field});if(S.history.length>500)S.history.length=500;}
function fieldHistory(field){return S.history.filter(h=>h.field===field);}

/* ------- checkpoint analytics ------- */
function sortedLog(){return[...S.log].sort((a,b)=>a.ts-b.ts);}
function analytics(){const L=sortedLog();const base=L[0];
  return L.map((e,i)=>{const p=L[i-1];const gain=p?e.totalSar-p.totalSar:0;const days=p?dDays(p.ts,e.ts):0;
    return{...e,gain,pct:p&&p.totalSar?gain/p.totalSar*100:0,days,avg:days?gain/days:0,cum:base?e.totalSar-base.totalSar:0,isFirst:i===0};});}
function realSeries(){return analytics().filter(o=>!o.isFirst&&o.type!=="rebalance"&&o.type!=="correction");}
function totalRealIncome(){return realSeries().reduce((s,o)=>s+o.gain,0);}
function avgGainPerDay(){const r=realSeries();if(!r.length)return 0;const d=r.reduce((s,o)=>s+o.days,0),g=r.reduce((s,o)=>s+o.gain,0);return d>0?g/d:0;}
function lastGain(){const a=analytics();return a.length>1?a[a.length-1].gain:0;}
function currentVsLast(){const L=sortedLog();if(!L.length)return{has:false,gain:0};return{has:true,gain:totalsAll().sar-L[L.length-1].totalSar};}

/* ------- charts (SVG strings, tap tooltips) ------- */
function lineChart(points){
  const W=320,H=140,pl=8,pr=10,pt=14,pb=22;
  if(!points.length)return`<div class="empty">${t('noCheckpoints')}</div>`;
  const iw=W-pl-pr,ih=H-pt-pb,vals=points.map(p=>p.val);
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}const pad=(mx-mn)*.14;mn-=pad;mx+=pad;
  const t0=points[0].ts,t1=points[points.length-1].ts,ts=(t1-t0)||1;
  const X=p=>pl+(points.length===1?iw/2:((p.ts-t0)/ts)*iw),Y=v=>pt+ih-((v-mn)/(mx-mn))*ih;
  const line=points.map(p=>`${X(p).toFixed(1)} ${Y(p.val).toFixed(1)}`).join(" L ");
  const area=`M ${line} L ${(pl+iw).toFixed(1)} ${pt+ih} L ${pl} ${pt+ih} Z`;
  const dots=points.map((p,i)=>`<circle data-pt='${JSON.stringify({d:p.label,v:money(p.val,'SAR')+' SAR'})}' cx="${X(p).toFixed(1)}" cy="${Y(p.val).toFixed(1)}" r="${i===points.length-1?4.5:3}" fill="var(--green)" stroke="var(--card)" stroke-width="2"/>`).join("");
  return`<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity="0.20"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/><path d="M ${line}" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${dots}
    <text x="${pl}" y="${H-6}" font-size="9.5" fill="var(--muted)" font-family="var(--ff)">${points[0].label}</text>
    <text x="${pl+iw}" y="${H-6}" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--ff)">${points[points.length-1].label}</text></svg><div class="cht-tip" hidden></div></div>`;
}
function barChart(bars,threshold){
  const W=320,H=140,pt=16,pb=24,pl=6,pr=6;
  if(!bars.length)return`<div class="empty">${t('noCheckpoints')}</div>`;
  const iw=W-pl-pr,ih=H-pt-pb,mx=Math.max(1,...bars.map(b=>Math.abs(b.val)),threshold);
  const n=bars.length,step=iw/n,bw=Math.min(step*.5,26);
  const ty=pt+ih-(threshold/mx)*ih;
  const thLine=threshold>0?`<line x1="${pl}" y1="${ty}" x2="${pl+iw}" y2="${ty}" stroke="var(--gold)" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.7"/>`:"";
  const rects=bars.map((b,i)=>{const bh=(Math.abs(b.val)/mx)*ih;const cx=pl+step*i+step/2;const good=b.val>=threshold;
    return`<rect data-pt='${JSON.stringify({d:b.label,v:signed(b.val)+' SAR'})}' x="${(cx-bw/2).toFixed(1)}" y="${(pt+ih-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,bh).toFixed(1)}" rx="5" fill="${good?'var(--pos)':'var(--neg)'}"/>${n<=8?`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-family="var(--ff)">${b.label}</text>`:""}`;}).join("");
  return`<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}">${thLine}${rects}</svg><div class="cht-tip" hidden></div></div>`;
}

/* ------- zakat compute ------- */
function computeNisabSar(){const s=S.settings;if(s.nisabBasis==='gold')return 85*(+s.goldPrice||300);if(s.nisabBasis==='custom')return +s.nisabSar||2000;return 595*(+s.silverPrice||3.2);}
function computeZakat(){
  const eligSar=eligibleYern()/rSar();
  const nisab=computeNisabSar(), above=eligSar>=nisab, rate=(S.settings.zakatRate||2.5)/100;
  const due=above?eligSar*rate:0;
  const held=S.zakatHeldSince, hawlLen=S.settings.hawlLen||354, days=dDays(held,Date.now());
  const pct=Math.min(100,Math.round(days/hawlLen*100)),done=days>=hawlLen,left=Math.max(0,hawlLen-days),dueDate=held+hawlLen*DAY;
  return{eligSar,nisab,above,due,pct,done,left,dueDate};
}
/* ------- activity/history display ------- */
function kindMeta(kind){return{
  edit:{ic:"pencil",c:"var(--green)",t:"var(--green-soft)"},transfer:{ic:"transfer",c:"var(--gold)",t:"var(--gold-soft)"},
  checkpoint:{ic:"check",c:"var(--pos)",t:"var(--pos-soft)"},correction:{ic:"refresh",c:"var(--gold)",t:"var(--gold-soft)"},
  income:{ic:"coins",c:"var(--pos)",t:"var(--pos-soft)"},expense:{ic:"arrowDown",c:"var(--neg)",t:"var(--neg-soft)"},
  denom:{ic:"coins",c:"var(--green)",t:"var(--green-soft)"},hide:{ic:"lock",c:"var(--muted)",t:"var(--chip)"},
  goal:{ic:"target",c:"var(--green)",t:"var(--green-soft)"}}[kind]||{ic:"clock",c:"var(--muted)",t:"var(--chip)"};}
const EXP_CATS=["food","rent","bills","medical","transport","family","other"];
function todayExpense(){const d=new Date();d.setHours(0,0,0,0);const s0=d.getTime();let tot=0;S.expenses.forEach(e=>{if(e.ts>=s0)tot+=(+e.sar||0);});return tot;}
function expenseInRange(days){const from=Date.now()-days*DAY;let tot=0;const byCat={};S.expenses.forEach(e=>{if(e.ts>=from){tot+=(+e.sar||0);byCat[e.cat]=(byCat[e.cat]||0)+(+e.sar||0);}});return{tot,byCat};}
function incomeInRange(days){const from=Date.now()-days*DAY,by={1:0,2:0,3:0};let tot=0;S.income.forEach(e=>{if(e.ts>=from){by[e.shift]=(by[e.shift]||0)+(+e.sar||0);tot+=(+e.sar||0);}});return{by,tot};}
function todayIncome(){const d=new Date();d.setHours(0,0,0,0);const s0=d.getTime(),by={1:0,2:0,3:0};let tot=0;S.income.forEach(e=>{if(e.ts>=s0){by[e.shift]=(by[e.shift]||0)+(+e.sar||0);tot+=(+e.sar||0);}});return{by,tot};}
function histAmount(h){
  if(h.kind==="transfer")return{txt:money(h.val,h.cur)+" "+h.cur,c:"var(--muted)"};
  if(h.kind==="income")return{txt:"+"+money(h.val,h.cur)+" "+h.cur,c:"var(--pos)"};
  if(h.kind==="expense")return{txt:"−"+money(h.val,h.cur)+" "+h.cur,c:"var(--neg)"};
  if(h.kind==="checkpoint"){const d=h.val-h.old;return{txt:signed(d),c:d>=0?"var(--pos)":"var(--neg)"};}
  const d=(+h.val||0)-(+h.old||0);return{txt:money(h.val,h.cur)+" "+h.cur,c:d>=0?"var(--pos)":"var(--neg)"};}
function histTitle(h){
  if(h.kind==="transfer")return h.name;
  if(h.kind==="checkpoint")return t('checkpoint');
  const verb=h.kind==="denom"?"":(h.kind==="correction"?" · "+t('tagCorrection'):"");
  return h.name+verb;}

function splitByCurrency(){const by={};visibleLocs().forEach(l=>{if(l.denoms)l.denoms.forEach(d=>{by[d.cur]=(by[d.cur]||0)+(+d.n||0)*d.denom*toYern(d.cur);});(l.holdings||[]).forEach(h=>{by[h.cur]=(by[h.cur]||0)+(+h.amount||0)*toYern(h.cur);});if(!l.denoms&&!l.holdings)by[l.cur]=(by[l.cur]||0)+(+l.amount||0)*toYern(l.cur);});return by;}
function splitByLocation(){return visibleLocs().map(l=>({name:locName(l),yern:locYern(l)})).sort((a,b)=>b.yern-a.yern);}

/* ============================ LOG ============================ */
function groupGains(period){
  const r=realSeries(),map=new Map();
  r.forEach(o=>{const d=new Date(o.ts);let key,label;
    if(period==="month"){key=d.getFullYear()*12+d.getMonth();label=d.toLocaleDateString(isRTL()?"ar":"en-GB",{month:"short",year:"2-digit"});}
    else{const dt=new Date(o.ts);const day=(dt.getDay()+6)%7;dt.setHours(0,0,0,0);dt.setDate(dt.getDate()-day);key=dt.getTime();label=dt.toLocaleDateString(isRTL()?"ar":"en-GB",{day:"numeric",month:"short"});}
    const c=map.get(key)||{label,val:0,key};c.val+=o.gain;map.set(key,c);});
  return[...map.values()].sort((a,b)=>a.key-b.key);}
function viewLog(){
  const pc=S.settings.primaryCur,A=analytics();
  let pts=sortedLog().map(e=>({ts:e.ts,val:e.totalSar,label:fmtDate(e.ts)}));
  if(sortedLog().length)pts=pts.concat([{ts:Date.now(),val:totalsAll().sar,label:t('cannotToday')}]);
  const bars=groupGains(PERIOD);const gains=bars.map(b=>b.val);const mean=gains.length?gains.reduce((a,b)=>a+b,0)/gains.length:0;const thr=mean>0?mean:0;
  const last=A.length?A[A.length-1]:{cum:0};
  const rows=A.length?[...A].reverse().map(cpRow).join(""):`<div class="empty" style="padding:26px">${t('firstCp')}</div>`;

    </div>
    <div class="row" style="justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span class="muted" style="font-size:12px;font-weight:600">${t('last30d')} · ${isRTL()?'الإجمالي':'total'}</span><b class="num" style="color:var(--pos)">+${money(inc.tot,'SAR')} SAR</b></div>
  </div>`;
  return`
  <div class="card p">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div style="font-size:12px;color:var(--muted);font-weight:600">${t('currentTotal')}</div>
        <div class="num" style="font-size:28px;font-weight:800">${money(totalIn(pc),pc)} <span style="font-size:14px;color:var(--muted)">${pc}</span></div></div>
      <button class="qbtn pri" style="flex:none;flex-direction:row;padding:10px 13px;font-size:12.5px" data-act="checkpoint">${icon('check',16,2.1)}${t('checkpoint')}</button>

function cpRow(o){

}

function monthRange(off){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);d.setMonth(d.getMonth()+off);const start=d.getTime();const e=new Date(d);e.setMonth(e.getMonth()+1);return{start,end:e.getTime(),label:d.toLocaleDateString(dLoc(),{month:"long",year:"numeric"})};}
function statementData(off){const {start,end,label}=monthRange(off);
  const incBy={1:0,2:0,3:0};let incTot=0;S.income.forEach(e=>{if(e.ts>=start&&e.ts<end){incBy[e.shift]=(incBy[e.shift]||0)+(+e.sar||0);incTot+=(+e.sar||0);}});
  const expBy={};let expTot=0;S.expenses.forEach(e=>{if(e.ts>=start&&e.ts<end){expBy[e.cat]=(expBy[e.cat]||0)+(+e.sar||0);expTot+=(+e.sar||0);}});
  const all=sortedLog();const inM=all.filter(c=>c.ts>=start&&c.ts<end);let nwChange=0;
  if(inM.length){const prior=all.filter(c=>c.ts<start).pop();nwChange=inM[inM.length-1].totalSar-(prior?prior.totalSar:inM[0].totalSar);}
  return{label,incBy,incTot,expBy,expTot,net:incTot-expTot,nwChange};}

  return`

    ${Object.keys(D.expBy).length?Object.keys(D.expBy).map(c=>`<div class="row" style="justify-content:space-between;margin-top:9px;font-size:12.5px"><span class="muted" style="font-weight:600">${t('cat_'+c)}</span><span class="num" style="font-weight:700">${money(D.expBy[c],'SAR')} SAR</span></div>`).join(""):`<div class="empty">${t('noExpense')}</div>`}

}

/* ============================ ACTIONS ============================ */
function gv(id){const e=document.getElementById(id);return e?e.value:"";}
function addCheckpoint(totalSar,type){const c={id:uid('cp'),ts:Date.now(),totalSar:Math.round(totalSar),type:type||'income',note:''};S.log.push(c);return c;}
function doCheckpoint(){const tot=totalsAll().sar,prev=sortedLog()[sortedLog().length-1];
  addCheckpoint(tot,'income');pushHist('checkpoint',t('checkpoint'),prev?prev.totalSar:tot,Math.round(tot),'SAR','cp');
  save();render();toast(t('checkpointSaved')+' · '+signed(prev?tot-prev.totalSar:0));}
let autoT;function scheduleAutoCp(){if(!S.settings.autoCheckpoint)return;clearTimeout(autoT);
  autoT=setTimeout(()=>{const L=sortedLog(),last=L[L.length-1];if(!last)return;const cur=totalsAll().sar;
    if(Math.abs(cur-last.totalSar)<Math.max(1,last.totalSar*0.0006))return;addCheckpoint(cur,'income');
    pushHist('checkpoint',t('checkpoint'),last.totalSar,Math.round(cur),'SAR','cp');save();
    if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();},1600);}
function handleAct(a,el){const id=el&&el.dataset?el.dataset.id:null;switch(a){
  case"checkpoint":doCheckpoint();break;
  case"transfer":openSheet(sheetTransfer());break;
  case"add":openSheet(sheetAdd());break;
  case"income":openSheet(sheetIncome());break;
  case"expense":openSheet(sheetExpense());break;
  case"addGoal":openSheet(sheetGoal(null));break;
  case"edAddCur":{const used=EDIT_HOLDINGS.map(h=>h.cur);const next=CODES.find(c=>!used.includes(c))||"SAR";EDIT_HOLDINGS.push({cur:next,amount:0});renderEditHoldings();break;}
  case"editSave":{const l=S.locations.find(x=>x.id===id);const nm=gv('edName').trim()||l.name;const renamed=nm!==l.name;const oldSar=locSar(l);
    const out=[];EDIT_HOLDINGS.forEach(h=>{const ex=out.find(x=>x.cur===h.cur),amt=parseNum(h.amount);if(ex)ex.amount+=amt;else out.push({cur:h.cur,amount:amt});});
    l.name=nm;if(renamed)l.nameAr=nm;l.holdings=out.length?out:[{cur:"SAR",amount:0}];delete l.cur;delete l.amount;l.changed=Date.now();
    pushHist(EDKIND==='real'?'edit':'correction',nm,Math.round(oldSar),Math.round(locSar(l)),'SAR','loc:'+id);save();closeSheet();render();
    if(EDKIND==='real'){toast(t('balanceUpdated'),t('checkpoint'),doCheckpoint);scheduleAutoCp();}else toast(t('loggedCorrection'));break;}
  case"editHide":{const l=S.locations.find(x=>x.id===id);l.hidden=!l.hidden;save();closeSheet();render();toast(l.hidden?t('placeHidden'):t('placeShown'));break;}
  case"editDelete":{const l=S.locations.find(x=>x.id===id);S.locations=S.locations.filter(x=>x.id!==id);save();closeSheet();render();toast(t('deleted')+' '+(l?locName(l):''));break;}
  case"transferSave":{const from=S.locations.find(l=>l.id===gv('trFrom')),to=S.locations.find(l=>l.id===gv('trTo'));const amt=parseNum(gv('trAmt')),cur=gv('trCur');
    if(!from||!to||from.id===to.id||!amt){closeSheet();break;}
    const fromH=(from.holdings||[]).find(h=>h.cur===cur),avail=fromH?(+fromH.amount||0):0;
    if(amt>avail+0.001){toast((isRTL()?'غير كافٍ · متاح ':'Not enough · ')+money(avail,cur)+' '+cur);break;}
    addToHolding(from,cur,-amt);addToHolding(to,cur,amt);
    pushHist('transfer',locName(from)+' → '+locName(to),0,amt,cur,'transfer');save();closeSheet();render();toast(t('transferred'));break;}
  case"addSave":{const place=gv('addPlace'),amt=parseNum(gv('addAmt')),cur=gv('addCur');
    if(place&&place!=='new'){const l=S.locations.find(x=>x.id===place);if(l){addToHolding(l,cur,amt);pushHist('edit',locName(l),0,Math.round(convert(amt,cur,'SAR')),'SAR','loc:'+l.id);}save();closeSheet();render();toast(t('balanceUpdated'));break;}
    const nm=gv('addName').trim();if(!nm){closeSheet();break;}const nl={id:uid('loc'),name:nm,nameAr:nm,icon:'wallet',holdings:[{cur,amount:amt}],eligible:true,changed:Date.now()};
    S.locations.push(nl);pushHist('edit',nm,0,Math.round(convert(amt,cur,'SAR')),'SAR','loc:'+nl.id);save();closeSheet();render();toast(t('balanceAdded'));break;}
  case"incSave":{const amt=parseNum(gv('incAmt'));if(!amt){closeSheet();break;}const cur=gv('incCur'),locId=gv('incLoc'),note=gv('incNote').trim();
    const dv=gv('incDate'),ts=dv?new Date(dv+'T12:00:00').getTime():Date.now();const loc=S.locations.find(x=>x.id===locId);if(loc)addToHolding(loc,cur,amt);
    const sar=convert(amt,cur,'SAR'),incId=uid('inc');S.income.push({id:incId,ts,shift:INC_SHIFT,amount:amt,cur,locId,sar,note});
    pushHist('income',t('shift')+' '+INC_SHIFT+(loc?' → '+locName(loc):''),0,amt,cur,'inc:'+incId);save();closeSheet();render();toast(t('incomeLogged')+' · +'+money(sar,'SAR')+' SAR');break;}
  case"expSave":{const amt=parseNum(gv('expAmt'));if(!amt){closeSheet();break;}const cur=gv('expCur'),locId=gv('expLoc'),note=gv('expNote').trim();
    const dv=gv('expDate'),ts=dv?new Date(dv+'T12:00:00').getTime():Date.now();const loc=S.locations.find(x=>x.id===locId);if(loc)addToHolding(loc,cur,-amt);
    const sar=convert(amt,cur,'SAR'),expId=uid('exp');S.expenses.push({id:expId,ts,amount:amt,cur,locId,cat:EXP_CAT,sar,note});
    pushHist('expense',t('cat_'+EXP_CAT)+(loc?' · '+locName(loc):''),0,amt,cur,'exp:'+expId);save();closeSheet();render();toast(t('expenseLogged')+' · −'+money(sar,'SAR')+' SAR');break;}
  case"lockerDone":save();closeSheet();render();toast(t('saved_t'));break;
  case"histDelete":{const h=S.history.find(x=>x.id===id);if(h){
      if(h.field&&h.field.indexOf('inc:')===0){const e=S.income.find(x=>x.id===h.field.slice(4));if(e){const loc=S.locations.find(l=>l.id===e.locId);if(loc)addToHolding(loc,e.cur,-e.amount);S.income=S.income.filter(x=>x.id!==e.id);}}
      else if(h.field&&h.field.indexOf('exp:')===0){const e=S.expenses.find(x=>x.id===h.field.slice(4));if(e){const loc=S.locations.find(l=>l.id===e.locId);if(loc)addToHolding(loc,e.cur,e.amount);S.expenses=S.expenses.filter(x=>x.id!==e.id);}}
      S.history=S.history.filter(x=>x.id!==id);}save();closeSheet();render();toast(t('deleted'));break;}
  case"goalSave":{const nm=gv('glName').trim();if(!nm){closeSheet();break;}const target=parseNum(gv('glTarget')),saved=parseNum(gv('glSaved')),cur=gv('glCur');
    if(id){const g=S.goals.find(x=>x.id===id);g.name=nm;g.nameAr=nm;g.target=target;g.saved=saved;g.cur=cur;}
    else S.goals.push({id:uid('g'),name:nm,nameAr:nm,icon:'target',cur,target,saved});save();closeSheet();render();toast(id?t('saved_t'):t('goalAdded'));break;}
  case"goalDelete":S.goals=S.goals.filter(g=>g.id!==id);save();closeSheet();render();toast(t('deleted'));break;
  case"cpSave":{const c=S.log.find(x=>x.id===id);if(c){c.totalSar=parseNum(gv('cpTot'));const dv=gv('cpDate');if(dv)c.ts=new Date(dv+'T12:00:00').getTime();c.type=gv('cpType');}save();closeSheet();render();toast(t('saved_t'));break;}
  case"cpDelete":S.log=S.log.filter(x=>x.id!==id);save();closeSheet();render();toast(t('deleted'));break;
  case"export":exportData();break;
  case"backupLocal":Native.backupLocal();break;
  case"backupDrive":Native.backupDrive();break;
  case"printStmt":printStatement();break;
  case"reset":openSheet(sheetReset());break;
  case"doReset":{const lang=S.settings.lang,theme=S.settings.theme;S=defaults();S.settings.lang=lang;S.settings.theme=theme;S.settings.onboarded=true;save();TAB='home';closeSheet();render();toast(t('resetDone'));break;}
  case"closeSheet":closeSheet();break;
  case"toastAction":if(PENDING){const fn=PENDING;PENDING=null;hideToast();fn();}break;
  case"onbSample":loadDemo();closeSheet();TAB='home';render();break;
  case"onbEmpty":S.settings.onboarded=true;save();closeSheet();break;
}}
function toggleSet(key){if(key==='theme'){S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();applyTheme();render();return;}
  S.settings[key]=!S.settings[key];save();render();if(key==='reminders')Native.syncReminder();}
function applySel(key,val){S.settings[key]=val;save();if(key==='primaryCur')render();if(key==='reminderDay'&&S.settings.reminders)Native.syncReminder();}

/* ------- toast ------- */
let toastT;
function toast(msg,actionLabel,fn){const e=document.getElementById("toast");PENDING=fn||null;
  e.innerHTML=`<span style="color:var(--toast-accent)">${icon('check',18,2.2)}</span><span class="tmsg" style="flex:1">${esc(msg)}</span>${actionLabel?`<button class="taction" data-act="toastAction">${esc(actionLabel)}</button>`:""}`;
  e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(hideToast,fn?4600:2200);}
function hideToast(){document.getElementById("toast").classList.remove("show");}

/* ------- chart tooltip ------- */
function showChartTip(el){const wrap=el.closest(".chartwrap");if(!wrap)return;const tip=wrap.querySelector(".cht-tip");if(!tip)return;
  let d;try{d=JSON.parse(el.getAttribute("data-pt"));}catch(e){return;}
  tip.innerHTML=`<b>${d.v}</b><br><span style="opacity:.75">${d.d}</span>`;
  tip.style.cssText="position:absolute;pointer-events:none;background:var(--ink);color:var(--card);padding:6px 9px;border-radius:9px;font-size:11.5px;font-weight:600;line-height:1.35;z-index:5;box-shadow:var(--shadow-hero);white-space:nowrap;text-align:center";
  tip.hidden=false;const wr=wrap.getBoundingClientRect(),er=el.getBoundingClientRect();const x=er.left-wr.left+er.width/2,y=er.top-wr.top;const tw=tip.offsetWidth||60;
  tip.style.left=Math.max(2,Math.min(wr.width-tw-2,x-tw/2))+"px";tip.style.top=Math.max(-2,y-tip.offsetHeight-8)+"px";
  clearTimeout(tip._t);tip._t=setTimeout(()=>{tip.hidden=true;},2400);}

function importFromFile(el){const f=el.files&&el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);if(!obj||!obj.locations||!obj.settings)throw 0;S=deepMerge(defaults(),obj);migrateLocs();save();TAB='home';applyTheme();applyLangDom();render();toast(t('importDone'));}catch(e){toast(t('importBad'));}};rd.readAsText(f);}
function logRate(){const c={usdYern:S.rates.usdYern,sarYern:S.rates.sarYern,usdYers:S.rates.usdYers},last=S.rateHistory[S.rateHistory.length-1];if(!last||last.usdYern!==c.usdYern||last.sarYern!==c.sarYern||last.usdYers!==c.usdYers){S.rateHistory.push({ts:Date.now(),...c});if(S.rateHistory.length>100)S.rateHistory.shift();}}

/* ------- theme / lang / lock ------- */
function applyTheme(){document.documentElement.setAttribute("data-theme",S.settings.theme);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.settings.theme==='dark'?'#101512':'#0B6B53';}
function applyLangDom(){const l=S.settings.lang;document.documentElement.lang=l==='ar'?'ar':'en';document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.getElementById("lockT").textContent=t('locked');document.getElementById("lockP").textContent=t('unlockTap');}

/* ------- biometric unlock gate ------- */
async function tryUnlock(){
  const lock=document.getElementById("lock");
  if(!CAP()){ lock.hidden=true; return; }                       // browser: never lock
  if(!(await Native.bioAvailable())){ lock.hidden=true; return; } // no enrolled biometric: don't lock out
  document.getElementById("lockP").textContent=t('unlockTap');
  const ok=await Native.bioVerify();
  if(ok){ lock.hidden=true; } else { document.getElementById("lockP").textContent=t('unlockRetry'); }
}
let _hidAt=0;
document.addEventListener("visibilitychange",()=>{
  if(!(S.settings.biometric && CAP())) return;
  if(document.visibilityState==="hidden"){ _hidAt=Date.now(); return; }
  if(S.settings.lockTimeout==="Never") return;
  const mins={"Immediately":0,"1 min":1,"5 min":5,"30 min":30}[S.settings.lockTimeout]||0;
  if(Date.now()-_hidAt >= mins*60000){ document.getElementById("lock").hidden=false; tryUnlock(); }
});

/* ------- init ------- */
function init(){load();applyTheme();applyLangDom();
  if(S.settings.biometric && CAP()){ document.getElementById("lock").hidden=false; tryUnlock(); }
  document.getElementById("fpBtn").onclick=()=>{ tryUnlock(); };

  document.body.addEventListener("click",e=>{
    if(e.target.closest("#langBtn")){S.settings.lang=isRTL()?'en':'ar';save();applyLangDom();render();return;}
    const pt=e.target.closest("[data-pt]");if(pt){showChartTip(pt);return;}
    const ek=e.target.closest("[data-edkind]");if(ek){EDKIND=ek.dataset.edkind;ek.parentNode.querySelectorAll(".typebtn").forEach(b=>b.classList.toggle("on",b===ek));return;}
    const tab=e.target.closest("[data-tab]");if(tab){go(tab.dataset.tab);return;}
    const tg=e.target.closest("[data-toggle]");if(tg){toggleSet(tg.dataset.toggle);return;}
    const per=e.target.closest("[data-period]");if(per){PERIOD=per.dataset.period;render();return;}
    const hf=e.target.closest("[data-hfilter]");if(hf){HFILTER=hf.dataset.hfilter;render();return;}
    const st2=e.target.closest("[data-stmt]");if(st2){STMT_MONTH=Math.min(0,STMT_MONTH+(+st2.dataset.stmt));render();return;}
    const zk=e.target.closest("[data-zk]");if(zk){const l=S.locations.find(x=>x.id===zk.dataset.zk);l.eligible=!l.eligible;save();render();return;}
    const uh=e.target.closest("[data-unhide]");if(uh){const l=S.locations.find(x=>x.id===uh.dataset.unhide);l.hidden=false;save();render();toast(t('placeShown'));return;}
    const hdel=e.target.closest("[data-hdel]");if(hdel){EDIT_HOLDINGS.splice(+hdel.dataset.hdel,1);renderEditHoldings();return;}
    const ed=e.target.closest("[data-edit]");if(ed){openSheet(sheetEdit(ed.dataset.edit));renderEditHoldings();return;}
    const lk=e.target.closest("[data-locker]");if(lk){openSheet(sheetLocker());return;}
    const cp=e.target.closest("[data-cp]");if(cp){const c=S.log.find(x=>x.id===cp.dataset.cp);if(c)openSheet(sheetCp(c));return;}
    const gl=e.target.closest("[data-goal]");if(gl){const g=S.goals.find(x=>x.id===gl.dataset.goal);if(g)openSheet(sheetGoal(g));return;}
    const sh=e.target.closest("[data-shift]");if(sh){INC_SHIFT=+sh.dataset.shift;const par=sh.parentNode;if(par)par.querySelectorAll(".typebtn").forEach(x=>x.classList.toggle("on",x===sh));return;}
    const ec=e.target.closest("[data-expcat]");if(ec){EXP_CAT=ec.dataset.expcat;const par=ec.parentNode;if(par)par.querySelectorAll(".fchip").forEach(x=>x.classList.toggle("on",x===ec));return;}
    const hi=e.target.closest("[data-histid]");if(hi&&hi.dataset.histid){const h=S.history.find(x=>x.id===hi.dataset.histid);if(h)openSheet(sheetActivity(h));return;}
    const ac=e.target.closest("[data-act]");if(ac){handleAct(ac.dataset.act,ac);return;}
  });

  document.body.addEventListener("focusin",e=>{const el=e.target;if(!el.dataset)return;if(el.dataset.bind){const i=+el.dataset.bind.split(":")[1];const lk=S.locations.find(l=>l.denoms);if(lk)el.dataset.prev=lk.denoms[i].n||0;}else if(el.dataset.hold!==undefined){const lk=S.locations.find(l=>l.denoms);if(lk&&lk.holdings)el.dataset.prev=lk.holdings[+el.dataset.hold].amount||0;}});
  document.body.addEventListener("input",e=>{const el=e.target;if(!el.dataset)return;
    if(el.dataset.bind){const i=+el.dataset.bind.split(":")[1];const lk=S.locations.find(l=>l.denoms);if(lk){lk.denoms[i].n=Math.max(0,Math.round(parseNum(el.value)));updateDerived();save();}return;}
    if(el.dataset.hamt!==undefined){EDIT_HOLDINGS[+el.dataset.hamt].amount=el.value;updateEditPrev();return;}
    if(el.dataset.hold!==undefined){const lk=S.locations.find(l=>l.denoms);if(lk&&lk.holdings){lk.holdings[+el.dataset.hold].amount=parseNum(el.value);updateDerived();save();}return;}
    if(el.dataset.rate){const v=parseNum(el.value);if(v>0)S.rates[el.dataset.rate]=v;updateDerived();save();return;}
    if(el.id==="trAmt")updateTransferPrev();
  });
  document.body.addEventListener("change",e=>{const el=e.target;if(!el.dataset)return;
    if(el.dataset.bind){const i=+el.dataset.bind.split(":")[1];const lk=S.locations.find(l=>l.denoms);if(lk){const oldN=+(el.dataset.prev||0),d=lk.denoms[i],nv=d.n;if(oldN!==nv){d.changed=Date.now();lk.changed=Date.now();pushHist('denom',t('locker')+' '+CURI[d.cur].sym+d.denom,oldN*d.denom,nv*d.denom,d.cur,'loc:locker');save();}}return;}
    if(el.dataset.hcur!==undefined){EDIT_HOLDINGS[+el.dataset.hcur].cur=el.value;updateEditPrev();return;}
    if(el.dataset.hold!==undefined){const lk=S.locations.find(l=>l.denoms);if(lk){const h=lk.holdings[+el.dataset.hold],old=+(el.dataset.prev||0),nv=+h.amount||0;if(old!==nv){lk.changed=Date.now();pushHist('edit',t('locker')+' '+h.cur,Math.round(convert(old,h.cur,'SAR')),Math.round(convert(nv,h.cur,'SAR')),'SAR','loc:locker');save();}}return;}
    if(el.dataset.rate){logRate();save();updateDerived();return;}
    if(el.dataset.set){const k=el.dataset.set;S.settings[k]=k==='hawlLen'?Math.round(parseNum(el.value)):parseNum(el.value);save();render();return;}
    if(el.dataset.sel){applySel(el.dataset.sel,el.value);return;}
    if(el.id==="importFile"){importFromFile(el);return;}
    if(el.id==="addPlace"){const isNew=el.value==='new';const nw=document.getElementById("addNameWrap");if(nw)nw.style.display=isNew?'':'none';const cu=document.getElementById("addCur"),hint=document.getElementById("addHint");if(!isNew){const l=S.locations.find(x=>x.id===el.value);if(l&&cu)cu.innerHTML=curOpts(locPrimaryCur(l));if(hint)hint.textContent=tf('existingHint',l?locName(l):'');}else{if(cu)cu.innerHTML=curOpts('SAR');if(hint)hint.textContent=t('newHint');}return;}
    if(el.id==="trFrom"){refreshTrCur();return;}
    if(["trTo","trCur"].includes(el.id))updateTransferPrev();
  });

  render();
  if(!S.settings.onboarded)setTimeout(()=>openSheet(sheetOnboard()),350);
  try{ Native.syncReminder(); }catch(e){}
}
/* ============================ NATIVE BRIDGE (Capacitor) ============================ */
function CAP(){ return (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ? window.Capacitor : null; }
const Native = {
  isNative(){ return !!CAP(); },
  _fn(){ return "mizan-backup-"+new Date().toISOString().slice(0,10)+".json"; },
  async backupLocal(){
    const c=CAP(), data=JSON.stringify(S,null,2), fn=this._fn();
    if(c && c.Plugins && c.Plugins.Filesystem){
      try{ await c.Plugins.Filesystem.writeFile({path:fn,data,directory:"DOCUMENTS",encoding:"utf8",recursive:true});
        toast((isRTL()?"حُفظ في المستندات · ":"Saved to Documents · ")+fn); }
      catch(e){ toast(isRTL()?"تعذّر الحفظ":"Backup failed"); }
    } else { exportData(); }
  },
  async backupDrive(){
    const c=CAP(), data=JSON.stringify(S,null,2), fn=this._fn();
    if(c && c.Plugins && c.Plugins.Filesystem && c.Plugins.Share){
      try{ const res=await c.Plugins.Filesystem.writeFile({path:fn,data,directory:"CACHE",encoding:"utf8"});
        await c.Plugins.Share.share({title:"Mizan backup",text:"Mizan data backup",url:res.uri,dialogTitle:(isRTL()?"حفظ إلى Google Drive":"Save to Google Drive")}); }
      catch(e){ toast(isRTL()?"المشاركة غير متاحة":"Share unavailable"); }
    } else { exportData(); }
  },
  async scheduleWeekly(){
    const c=CAP(); if(!(c && c.Plugins && c.Plugins.LocalNotifications)) return;
    try{
      await c.Plugins.LocalNotifications.requestPermissions();
      const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      let wd=days.indexOf(S.settings.reminderDay); if(wd<0)wd=5; const weekday=wd+1; // Capacitor: 1=Sunday
      await c.Plugins.LocalNotifications.cancel({notifications:[{id:9001}]});
      await c.Plugins.LocalNotifications.schedule({notifications:[{id:9001,title:"Mizan",
        body:(isRTL()?"وقت تسجيل أرصدتك في ميزان":"Time to log your balances"),
        schedule:{on:{weekday,hour:20,minute:0},repeats:true}}]});
    }catch(e){}
  },
  async cancelWeekly(){ const c=CAP(); if(c && c.Plugins && c.Plugins.LocalNotifications){ try{ await c.Plugins.LocalNotifications.cancel({notifications:[{id:9001}]}); }catch(e){} } },
  syncReminder(){ if(!this.isNative())return; if(S.settings.reminders) this.scheduleWeekly(); else this.cancelWeekly(); },
  async bioAvailable(){ const c=CAP(); if(!(c&&c.Plugins&&c.Plugins.NativeBiometric)) return false;
    try{ const r=await c.Plugins.NativeBiometric.isAvailable(); return !!(r&&r.isAvailable); }catch(e){ return false; } },
  async bioVerify(){ const c=CAP(); if(!(c&&c.Plugins&&c.Plugins.NativeBiometric)) return true;
    try{ await c.Plugins.NativeBiometric.verifyIdentity({reason:(isRTL()?"افتح ميزان":"Unlock Mizan"),title:"Mizan",subtitle:"",description:(isRTL()?"استخدم بصمتك أو وجهك":"Use fingerprint or face"),useFallback:true,fallbackTitle:(isRTL()?"رمز الجهاز":"Use PIN"),maxAttempts:3}); return true; }
    catch(e){ return false; } },
};
/* weekly good/bad days (net = income − expenses per day) */
function weekStrip(){
  const now=new Date(), day=(now.getDay()+6)%7, monday=new Date(now); monday.setHours(0,0,0,0); monday.setDate(monday.getDate()-day);
  const todayS=new Date(new Date().setHours(0,0,0,0)).getTime(), out=[];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(d.getDate()+i); const s0=d.getTime(), e0=s0+DAY;
    let inc=0,exp=0; S.income.forEach(x=>{if(x.ts>=s0&&x.ts<e0)inc+=(+x.sar||0);}); S.expenses.forEach(x=>{if(x.ts>=s0&&x.ts<e0)exp+=(+x.sar||0);});
    const net=inc-exp, active=(inc||exp), col=!active?"var(--chip)":net>0?"var(--pos)":net<0?"var(--neg)":"var(--muted)";
    out.push({label:d.toLocaleDateString(dLoc(),{weekday:"narrow"}), col, isToday:s0===todayS, future:s0>todayS, net}); }
  return out;
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
