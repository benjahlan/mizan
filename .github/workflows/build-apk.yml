name: Build Mizan APK

# Runs automatically on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app dependencies
        run: npm install

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate the Android project
        run: npx cap add android

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload the APK (also downloadable from the Artifacts section)
        uses: actions/upload-artifact@v4
        with:
          name: Mizan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the apk branch (lets Claude fetch it automatically)
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          rm -rf /tmp/apkout && mkdir -p /tmp/apkout
          cp "$APK" /tmp/apkout/Mizan.apk
          cd /tmp/apkout
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Mizan.apk
          git commit -q -m "Mizan APK build [skip ci]"
          git branch -M apk
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" apk
